<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Object-Track Navigation Prototype</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <div id="controls">
      <button id="get-location">Get Current Location</button>
      <span id="loc-status">Location: unknown</span>
      <button id="start">Start Detection</button>
      <button id="stop" disabled>Stop</button>
      <div id="dest-info">Click the map to set destination</div>
    </div>

    <div id="map"></div>

    <div id="camera">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.9.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
